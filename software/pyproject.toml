[project]
name = "chunche"
version = "0.1.0"
description = "Software funcional para el prototipo Chunche de Mae Industries."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "numpy>=1.24",
  "Pillow>=10",
  "PyYAML>=6",
  "reportlab>=4",
]

[project.optional-dependencies]
hardware = [
  "adafruit-circuitpython-servokit>=1.3",
]
yolo = [
  "ultralytics>=8.0",
]
dev = [
  "pytest>=8",
]

[project.scripts]
chunche = "chunche.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

